plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'idea'
    id 'eclipse'
}

version = "0.0.1-SNAPSHOT"
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = "cook"
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://packages.broadcom.com/artifactory/spring-enterprise')
        credentials {
            username = System.getenv('SEC_ARTIFACTORY_USERNAME') ?: findProperty('secArtifactoryUsername') ?: ''
            password = System.getenv('SEC_ARTIFACTORY_PASSWORD') ?: findProperty('secArtifactoryPassword') ?: ''
        }
    }
}

dependencies {
    implementation("com.vmware.tanzu.spring.applicationservices:application-services-starter-config-client")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.security:spring-security-rsa:1.1.5")
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test")
    testImplementation("org.springframework.security:spring-security-test")
}

dependencyManagement {
    imports {
        mavenBom "com.vmware.tanzu.spring:tanzu-spring-sdk-dependencies:1.2.0"
    }
}

test {
    useJUnitPlatform()
}
